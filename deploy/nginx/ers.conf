# Reverse proxy + static frontend host for ERS.
# Copy to /etc/nginx/sites-available/ers, symlink into sites-enabled, then reload nginx.

server {
    listen 80;
    server_name _;   # replace with your domain once you have one

    root /opt/ers/frontend;
    index index.html;

    # React Router client-side routes -> always fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # 8080 must match SERVER_PORT in /opt/ers/ers-web.env (only set that if 8080 conflicts with
    # another app on this box - update all four proxy_pass lines below to match if you do).
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080/swagger-ui/;
    }

    location /v3/api-docs/ {
        proxy_pass http://127.0.0.1:8080/v3/api-docs/;
    }

    location /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }
}
