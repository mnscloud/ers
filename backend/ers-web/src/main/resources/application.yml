server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ers-web
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ers}
    username: ${DB_USER:ers}
    password: ${DB_PASSWORD:ers}
  jpa:
    hibernate:
      ddl-auto: validate
    # Entities are serialized directly in several controller responses in this scaffold (no DTO
    # mapping layer yet), so lazy associations must stay initializable for the life of the request.
    # Follow-up: introduce response DTOs per module and turn this back off.
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

ers:
  security:
    cors:
      # Comma-separated list of allowed origin patterns (supports * wildcards, e.g. https://*.example.com).
      # The localhost default only works for local dev - set this to your real domain(s) in production,
      # e.g. ERS_CORS_ALLOWED_ORIGINS=https://ers.example.com
      allowed-origin-patterns: ${ERS_CORS_ALLOWED_ORIGINS:http://localhost:*}
    jwt:
      secret: ${ERS_JWT_SECRET:change-me-in-production-change-me-in-production-32bytes-min}
      access-token-expiration-minutes: 30
      refresh-token-expiration-days: 7
    default-admin-username: ${ERS_ADMIN_USERNAME:admin}
    default-admin-password: ${ERS_ADMIN_PASSWORD:ChangeMe123!}
    ldap:
      enabled: ${ERS_LDAP_ENABLED:true}
      # embedded=true starts a throwaway UnboundID test server seeded from demo-users.ldif - zero
      # external setup for local dev/demo. For a real AD: embedded=false, urls/base/manager-dn/
      # manager-password pointed at it, user-dn-pattern (or switch to search-based auth) matching
      # its layout, and role-mappings renamed to your real AD group names.
      embedded: ${ERS_LDAP_EMBEDDED:true}
      embedded-ldif: classpath:ldap/demo-users.ldif
      embedded-base-dn: dc=ers,dc=local
      embedded-port: ${ERS_LDAP_EMBEDDED_PORT:11389}
      urls: ${ERS_LDAP_URLS:}
      base: ${ERS_LDAP_BASE:dc=ers,dc=local}
      group-search-base: ou=groups
      user-dn-pattern: "uid={0},ou=people"
      manager-dn: ${ERS_LDAP_MANAGER_DN:}
      manager-password: ${ERS_LDAP_MANAGER_PASSWORD:}
      try-first: true
      role-mappings:
        ERS-Admins: ADMIN
        ERS-Makers: RECON_MAKER
        ERS-Checkers: RECON_CHECKER
        ERS-Compliance: COMPLIANCE
        ERS-Viewers: VIEWER
  demo:
    enabled: ${ERS_DEMO_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.ers: DEBUG
